<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Confirmation">
    <meta name="author" content="Luis Adam">
    <title>Review Submitted - Luis Adam</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main class="confirmation">
        <h2>Thank You!</h2>
        <p>Your review has been submitted successfully.</p>

        <p>
            Reviews completed:
            <span id="reviewCount"></span>
        </p>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Luis Adam | Zimbabwe</p>
        <p id="lastModified"></p>
    </footer>

    <script>
        let reviewCount = Number(localStorage.getItem("reviewCount")) || 0;

        reviewCount++;

        localStorage.setItem("reviewCount", reviewCount);

        document.querySelector("#reviewCount").textContent = reviewCount;
    </script>
</body>
</html>
