<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Luis Adam">
    <meta name="description" content="This is an experiment about the load lazy experiment that on the pictures">
    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
    <title>Lazy Load</title>
</head>

<body>
    <main>
        <h1>Photo Album</h1>
        <img src="images/girl-1.jpg" alt="A smiling girl" width="612px" height="408px">
        <img src="images/girl-2.jpg" alt="A girl with Afro" loading="lazy" width="459px" height="612px">
        <img src="images/girl-3.jpg" alt="Girl enjoying" loading="lazy" width="612px" height="408px">
        <img src="images/girl-4.jpg" alt="Happy woman" loading="lazy" width="612px" height="459px">
        <img src="images/girl-5.jpg" alt="Smiling woman with long hair" loading="lazy" width="612px" height="459px">
        <img src="images/girl-6.jpg" alt="Long hair girl" loading="lazy" width="400px" height="600px">
    </main>

</body>

</html>
